<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unser Space</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172019;background:#f6f7f4}*{box-sizing:border-box}body{margin:0}header{padding:18px 22px;background:#fff;border-bottom:1px solid #e1e5df;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0}.brand{font-weight:800}.muted{color:#6c756e;font-size:13px}.wrap{max-width:1000px;margin:auto;padding:24px 18px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.btn,input,textarea,select{border:1px solid #dfe4dd;border-radius:10px;padding:10px 12px;font:inherit;background:#fff}.btn{cursor:pointer}.primary{background:#6c8f6a;color:#fff;border-color:#6c8f6a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{background:#fff;border:1px solid #e1e5df;border-radius:16px;padding:16px}.modal{display:none;position:fixed;inset:0;background:#0008;place-items:center;padding:18px}.modal.open{display:grid}.dialog{background:#fff;border-radius:18px;padding:22px;width:min(520px,100%)}label{display:block;font-size:12px;color:#6c756e;margin:10px 0}label input,label textarea,label select{display:block;width:100%;margin-top:5px}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.tag{display:inline-block;background:#eef2eb;border-radius:99px;padding:5px 8px;font-size:11px;margin-top:10px}a{color:#5d805b}@media(max-width:600px){header{align-items:flex-start;flex-direction:column}}</style></head><body><header><div><div class="brand">♡ Unser Space</div><div class="muted">Alles, was euch im Alltag begegnet.</div></div><div class="bar" style="margin:0"><button class="btn" id="share">↗ Teilen</button><button class="btn primary" id="add">＋ Hinzufügen</button></div></header><main class="wrap"><h1>Alles an einem Ort.</h1><p class="muted">Gemeinsam speichern, wiederfinden und kommentieren.</p><input id="search" placeholder="⌕ Suchen …" style="width:100%;max-width:420px"><div id="items" class="grid" style="margin-top:18px"></div></main><div class="modal open" id="login"><div class="dialog"><h2>Willkommen bei Unser Space</h2><p class="muted">Melde dich an, damit dein Space geräteübergreifend synchron bleibt.</p><label>E-Mail<input id="email" type="email"></label><label>Passwort<input id="pass" type="password"></label><div class="row"><button class="btn" id="signup">Konto erstellen</button><button class="btn primary" id="signin">Anmelden</button></div><p id="authmsg" class="muted"></p></div></div><div class="modal" id="shareModal"><div class="dialog"><h2>Gemeinsamer Space</h2><p class="muted">Dein Einladungscode</p><h1 id="code">—</h1><label>Code des Partners<input id="joinCode" maxlength="8" placeholder="AB12CD34"></label><div class="row"><button class="btn" id="closeShare">Schließen</button><button class="btn primary" id="join">Space beitreten</button></div><p id="sharemsg" class="muted"></p></div></div><div class="modal" id="addModal"><div class="dialog"><h2>Etwas Neues ablegen</h2><label>Titel<input id="title"></label><label>Beschreibung / Link<textarea id="desc"></textarea></label><label>Bereich<select id="cat"><option>Eingang</option><option>Haushalt</option><option>Studium</option><option>Selbstverbesserung</option><option>Artikel</option><option>Reisen</option><option>Ideen</option></select></label><div class="row"><button class="btn" id="closeAdd">Abbrechen</button><button class="btn primary" id="save">Speichern</button></div></div></div><script>const sb=window.supabase.createClient('https://ftmbisefpjncuokrlkkz.supabase.co','sb_publishable_029Uv8QlNMvq0QCrk8Rs1Q_dHaHoswf');let user,space;const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){const r=await sb.rpc('setup_my_space');if(r.error)throw r.error;space=r.data;const s=await sb.from('spaces').select('invite_code').eq('id',space).single();if(s.data)$('code').textContent=s.data.invite_code;const q=$('search').value.toLowerCase();const r2=await sb.from('items').select('*').eq('space_id',space).order('created_at',{ascending:false});$('items').innerHTML=(r2.data||[]).filter(x=>(x.title+' '+x.description).toLowerCase().includes(q)).map(x=>'<article class="card"><h3>'+esc(x.title)+'</h3><p class="muted">'+esc(x.description)+'</p><span class="tag">'+esc(x.category)+'</span></article>').join('')||'<p class="muted">Noch nichts gespeichert.</p>'}async function joinSpace(){const c=$('joinCode').value.trim().toUpperCase();if(!c)return;$('sharemsg').textContent='Verbinde …';const r=await sb.rpc('join_space',{p_invite_code:c});if(r.error){$('sharemsg').textContent=r.error.message;return}space=r.data;$('sharemsg').textContent='Gemeinsamer Space verbunden ✓';await load()}async function auth(){const r=await sb.auth.getSession();if(r.data.session){user=r.data.session.user;$('login').classList.remove('open');await load()}else $('login').classList.add('open')}$('signin').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(r.error)$('authmsg').textContent=r.error.message;else auth()};$('signup').onclick=async()=>{const r=await sb.auth.signUp({email:$('email').value,password:$('pass').value});$('authmsg').textContent=r.error?r.error.message:'Konto erstellt – ggf. E-Mail bestätigen.'};$('share').onclick=async()=>{$('shareModal').classList.add('open');if(space)await load()};$('closeShare').onclick=()=>$('shareModal').classList.remove('open');$('join').onclick=joinSpace;$('add').onclick=()=>$('addModal').classList.add('open');$('closeAdd').onclick=()=>$('addModal').classList.remove('open');$('save').onclick=async()=>{const t=$('title').value.trim();if(!t)return;await sb.from('items').insert({space_id:space,title:t,description:$('desc').value.trim()||'Ohne Beschreibung',category:$('cat').value,icon:'📌',who:'Gemeinsam',favorite:false,created_by:user.id});$('addModal').classList.remove('open');$('title').value='';$('desc').value='';await load()};$('search').oninput=()=>load();auth();</script></body></html>
